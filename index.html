<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daily Lap</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b10">
<style>
  :root {
    --bg: #0a0b10; --surface: #15161d; --surface-2: #1c1e28;
    --text: #f5f6f8; --text-dim: #8b8fa3; --text-faint: #4d5062;
    --accent: #4c6fff; --accent-dim: rgba(76,111,255,0.15);
    --up: #17c787; --down: #ff5c5c; --divider: rgba(255,255,255,0.07);
    --font: -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Helvetica Neue', sans-serif;
    --font-mono: 'SF Mono', 'IBM Plex Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); overflow-x: hidden; }
  .app { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; overflow: hidden; }

  .screen { position: absolute; top: 0; left: 0; width: 100%; min-height: 100vh; background: var(--bg);
    transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); padding: max(24px, env(safe-area-inset-top)) 20px 80px; }
  #home { transform: translateX(0); z-index: 1; }
  #detail { transform: translateX(100%); z-index: 2; }
  .app.open #home { transform: translateX(-16%); filter: brightness(0.6); }
  .app.open #detail { transform: translateX(0); }

  .home-date { font-size: 12px; color: var(--text-faint); margin-bottom: 22px; }
  .ring-wrap { position: relative; width: 168px; height: 168px; margin: 0 auto 8px; }
  .ring-bg { position: absolute; inset: 0; border-radius: 50%; background: var(--surface-2); }
  .ring-fg { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), transparent 0);
    mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 13px));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 13px)); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-center .num { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ring-center .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .ring-caption { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 30px; }
  .ring-caption b { color: var(--text); font-weight: 700; }

  .section-lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin: 0 2px 10px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--divider); cursor: pointer; }
  .row:active { background: var(--surface); }
  .row-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .row-dot.done { background: var(--up); }
  .row-dot.pending { background: var(--surface-2); border: 1px solid var(--text-faint); }
  .row-name { font-size: 14px; font-weight: 600; width: 74px; flex-shrink: 0; }
  .row-spark { flex-grow: 1; height: 22px; display: flex; align-items: flex-end; gap: 2px; }
  .row-spark .bar { flex: 1; background: var(--text-faint); border-radius: 2px 2px 0 0; opacity: 0.5; min-height: 2px; }
  .row-spark .bar.hi { background: var(--accent); opacity: 0.9; }
  .row-val { font-family: var(--font-mono); font-size: 13px; font-weight: 600; text-align: right; width: 56px; flex-shrink: 0; }
  .row-chev { color: var(--text-faint); font-size: 14px; flex-shrink: 0; }

  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .back-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .detail-title { font-size: 17px; font-weight: 700; }
  .detail-ticker { font-family: var(--font-mono); font-size: 10px; color: var(--accent); background: var(--accent-dim); padding: 2px 7px; border-radius: 5px; margin-left: 6px; font-weight: 700; }

  .hero-stat { margin-bottom: 20px; }
  .hero-stat .val { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hero-stat .val .unit { font-size: 16px; color: var(--text-dim); font-weight: 600; margin-left: 2px; }
  .hero-stat .delta { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .hero-stat .delta.up { color: var(--up); } .hero-stat .delta.down { color: var(--down); } .hero-stat .delta.neutral { color: var(--text-dim); }

  .log-form { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .log-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .log-form input[type="number"], .log-form input[type="text"] {
    background: var(--surface-2); border: 1px solid var(--divider); border-radius: 9px; color: var(--text);
    padding: 10px 12px; font-size: 14px; font-family: var(--font); outline: none; }
  .log-form input[type="number"] { width: 90px; font-family: var(--font-mono); }
  .log-form input[type="text"] { flex-grow: 1; }
  .log-form input::placeholder { color: var(--text-faint); }
  .log-btn { background: var(--accent); color: #fff; border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; }
  .log-btn:active { opacity: 0.85; }
  .log-btn.shake { animation: shake 0.3s; background: var(--down); }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  .log-hint { font-size: 11px; color: var(--down); margin-top: 6px; text-align: center; display: none; }
  .log-hint.show { display: block; }
  .habit-toggle { display: flex; align-items: center; justify-content: space-between; }
  .habit-toggle-btn { background: var(--surface-2); border: 1px solid var(--divider); border-radius: 9px; padding: 10px 16px; font-size: 13px; font-weight: 700; color: var(--text-dim); cursor: pointer; flex-grow: 1; text-align: center; }
  .habit-toggle-btn.done { background: var(--up); color: #06251a; border-color: transparent; }

  .chart-box { height: 110px; display: flex; align-items: flex-end; gap: 4px; margin-bottom: 20px; padding: 0 2px; }
  .chart-box .cbar { flex: 1; background: var(--surface-2); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-box .cbar.hi { background: linear-gradient(180deg, var(--accent), rgba(76,111,255,0.4)); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
  .cal-cell { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); }
  .cal-cell.on { background: var(--up); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--divider); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .stat-cell { background: var(--surface); padding: 14px 16px; }
  .stat-cell .v { font-family: var(--font-mono); font-size: 17px; font-weight: 700; }
  .stat-cell .l { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

  .log-item { padding: 12px 0; border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .log-date { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-bottom: 3px; }
  .log-note { font-size: 13px; color: var(--text-dim); }
  .log-del { color: var(--text-faint); font-size: 12px; cursor: pointer; padding: 2px 6px; flex-shrink: 0; }

  .reset-link { display: block; text-align: center; margin-top: 24px; font-size: 11px; color: var(--text-faint); text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="screen" id="home">
    <div class="home-date" id="home-date"></div>
    <div class="ring-wrap">
      <div class="ring-bg"></div>
      <div class="ring-fg" id="ring-fg"></div>
      <div class="ring-center"><div class="num" id="ring-num">0/8</div><div class="lbl">오늘 완료</div></div>
    </div>
    <div class="ring-caption">이번 달 평균 이행률 <b id="month-rate">-</b></div>
    <div class="section-lbl">나의 루틴</div>
    <div id="row-list"></div>
    <div class="reset-link" id="reset-btn">모든 기록 초기화</div>
  </div>

  <div class="screen" id="detail">
    <div class="detail-header">
      <div class="back-btn" id="back-btn">‹</div>
      <div class="detail-title" id="detail-title"></div>
    </div>
    <div id="detail-body"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'daily-lap-data';
const ROUTINES = [
  { id:'run', name:'러닝', ticker:'RUN', unit:'시간', target:10000, isHabit:false },
  { id:'str', name:'근력운동', ticker:'STR', unit:'시간', target:10000, isHabit:false },
  { id:'diet', name:'식단', ticker:'DIET', unit:'일', target:3650, isHabit:true },
  { id:'eng', name:'영어공부', ticker:'ENG', unit:'시간', target:10000, isHabit:false },
  { id:'bib', name:'말씀공부', ticker:'BIB', unit:'시간', target:10000, isHabit:false },
  { id:'qt', name:'QT', ticker:'QT', unit:'일', target:3650, isHabit:true },
  { id:'etf', name:'ETF', ticker:'ETF', unit:'일', target:3650, isHabit:true },
  { id:'etc', name:'기타연습', ticker:'ETC', unit:'시간', target:10000, isHabit:false },
];

function todayStr(offset=0) { const d = new Date(); d.setDate(d.getDate()-offset); return d.toISOString().slice(0,10); }

let state = {};
function loadState() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { state = {}; }
  ROUTINES.forEach(r => { if (!state[r.id]) state[r.id] = []; });
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function dayTotals(sessions) {
  const m = {};
  sessions.forEach(s => { m[s.date] = (m[s.date]||0) + s.amount; });
  return m;
}
function computeStats(r) {
  const sessions = state[r.id];
  const totals = dayTotals(sessions);
  const dates = Object.keys(totals).sort();
  const totalAll = Object.values(totals).reduce((a,b)=>a+b,0);
  const pct = Math.min(100, r.target ? totalAll/r.target*100 : 0);

  const now = new Date();
  const cy = now.getFullYear(), cm = now.getMonth()+1;
  const py = cm===1?cy-1:cy, pm = cm===1?12:cm-1;
  const thisM = Object.entries(totals).filter(([k])=>k.startsWith(`${cy}-${String(cm).padStart(2,'0')}`)).reduce((a,[,v])=>a+v,0);
  const lastM = Object.entries(totals).filter(([k])=>k.startsWith(`${py}-${String(pm).padStart(2,'0')}`)).reduce((a,[,v])=>a+v,0);
  let delta = null;
  if (lastM > 0) delta = (thisM-lastM)/lastM*100;
  else if (thisM === 0) delta = 0;

  let streak = 0, d = new Date();
  while (totals[d.toISOString().slice(0,10)]) { streak++; d.setDate(d.getDate()-1); }

  const daysInMonth = now.getDate();
  const activeDaysMonth = Object.keys(totals).filter(k=>k.startsWith(`${cy}-${String(cm).padStart(2,'0')}`)).length;
  const adherence = daysInMonth ? Math.round(activeDaysMonth/daysInMonth*100) : 0;

  const doneToday = !!totals[todayStr()];

  let eta = '기록 없음';
  if (totalAll > 0 && dates.length) {
    const start = new Date(dates[0]);
    const elapsed = Math.max(1, Math.ceil((now-start)/86400000)+1);
    const pace = totalAll/elapsed;
    const remaining = r.target - totalAll;
    if (remaining <= 0) eta = '만기 도달';
    else if (pace > 0) {
      const daysLeft = remaining/pace;
      let y = Math.floor(daysLeft/365), mo = Math.round((daysLeft%365)/30);
      if (mo===12){y++;mo=0;}
      eta = y ? `${y}년 ${mo}개월 후 만기` : `${mo}개월 후 만기`;
    }
  }

  const spark14 = []; for (let i=13;i>=0;i--) { const dd=new Date(); dd.setDate(dd.getDate()-i); spark14.push(totals[dd.toISOString().slice(0,10)]||0); }
  const cal30 = []; for (let i=29;i>=0;i--) { const dd=new Date(); dd.setDate(dd.getDate()-i); cal30.push(!!totals[dd.toISOString().slice(0,10)]); }

  return { totalAll, pct, thisM, delta, streak, adherence, doneToday, eta, spark14, cal30 };
}

function renderHome() {
  document.getElementById('home-date').textContent = new Date().toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'long' });
  const allStats = ROUTINES.map(r => ({ r, s: computeStats(r) }));
  const doneCount = allStats.filter(x => x.s.doneToday).length;
  document.getElementById('ring-num').textContent = `${doneCount}/${ROUTINES.length}`;
  document.getElementById('ring-fg').style.setProperty('--pct', (doneCount/ROUTINES.length*100).toFixed(0));
  const monthRate = Math.round(allStats.reduce((a,x)=>a + (x.r.isHabit ? x.s.adherence : Math.min(100, x.s.spark14.filter(v=>v>0).length/14*100)), 0) / allStats.length);
  document.getElementById('month-rate').textContent = monthRate + '%';

  const list = document.getElementById('row-list');
  list.innerHTML = allStats.map(({r,s}) => {
    const vals = r.isHabit ? s.cal30.slice(-14).map(b=>b?1:0.15) : s.spark14;
    const max = Math.max(...vals, 0.01);
    const bars = vals.map(v => `<div class="bar ${v/max>0.6?'hi':''}" style="height:${Math.max(8,v/max*100)}%"></div>`).join('');
    const mainVal = r.isHabit ? `${s.streak}일` : `${s.thisM.toFixed(1)}${r.unit==='시간'?'h':r.unit}`;
    return `<div class="row" data-id="${r.id}">
      <div class="row-dot ${s.doneToday?'done':'pending'}"></div>
      <div class="row-name">${r.name}</div>
      <div class="row-spark">${bars}</div>
      <div class="row-val">${mainVal}</div>
      <div class="row-chev">›</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.row').forEach(el => el.addEventListener('click', () => openDetail(el.getAttribute('data-id'))));
}

let currentId = null;
function openDetail(id) {
  currentId = id;
  renderDetail();
  document.getElementById('app').classList.add('open');
}
function closeDetail() { document.getElementById('app').classList.remove('open'); renderHome(); }

function renderDetail() {
  const r = ROUTINES.find(x => x.id === currentId);
  const s = computeStats(r);
  document.getElementById('detail-title').innerHTML = `${r.name}<span class="detail-ticker">${r.ticker}</span>`;

  let html = '';
  if (r.isHabit) {
    html += `<div class="hero-stat"><div class="val">${s.streak}<span class="unit">일 연속</span></div>
      <div class="delta neutral">이번 달 이행률 ${s.adherence}%</div></div>
      <div class="log-form"><div class="habit-toggle">
        <div class="habit-toggle-btn ${s.doneToday?'done':''}" id="habit-btn">${s.doneToday ? '✓ 오늘 완료함' : '오늘 완료 체크'}</div>
      </div></div>
      <div class="cal-grid">${s.cal30.map(on=>`<div class="cal-cell ${on?'on':''}"></div>`).join('')}</div>`;
  } else {
    const deltaHtml = s.delta === null ? '' : (s.delta === 0 && s.thisM === 0 ? `<div class="delta neutral">이번 달 기록 없음</div>` :
      `<div class="delta ${s.delta>=0?'up':'down'}">${s.delta>=0?'▲':'▼'} ${Math.abs(s.delta).toFixed(1)}% 지난달 대비</div>`);
    html += `<div class="hero-stat"><div class="val">${s.thisM.toFixed(1)}<span class="unit">시간</span></div>${deltaHtml}</div>
      <div class="log-form">
        <div class="log-form-row">
          <input type="number" step="0.1" min="0" inputmode="decimal" id="amount-input" placeholder="시간 (예: 0.5)">
          <input type="text" id="note-input" placeholder="메모 (선택)">
        </div>
        <button class="log-btn" id="add-btn">오늘 기록 추가</button>
        <div class="log-hint" id="log-hint">시간을 0보다 크게 입력해주세요 (예: 0.5)</div>
      </div>
      <div class="chart-box">${(()=>{const max=Math.max(...s.spark14,0.01);return s.spark14.map(v=>`<div class="cbar ${v/max>0.6?'hi':''}" style="height:${Math.max(4,v/max*100)}%"></div>`).join('');})()}</div>`;
  }

  html += `<div class="stat-grid">
    <div class="stat-cell"><div class="v">${s.totalAll.toLocaleString(undefined,{maximumFractionDigits:1})}${r.unit}</div><div class="l">누적</div></div>
    <div class="stat-cell"><div class="v">${r.target.toLocaleString()}${r.unit}</div><div class="l">목표(만기)</div></div>
    <div class="stat-cell"><div class="v">${s.pct.toFixed(1)}%</div><div class="l">진행률</div></div>
    <div class="stat-cell"><div class="v" style="font-size:13px">${s.eta}</div><div class="l">예상 도달</div></div>
  </div>`;

  const recentLogs = state[r.id].slice(-10).reverse();
  html += `<div class="section-lbl">최근 기록</div>`;
  html += recentLogs.length ? recentLogs.map((log, idx) => `
    <div class="log-item">
      <div><div class="log-date">${log.date}</div><div class="log-note">${r.isHabit ? '완료' : log.amount + r.unit}${log.note ? ' · ' + escapeHtml(log.note) : ''}</div></div>
      <div class="log-del" data-del="${state[r.id].length - 1 - idx}">삭제</div>
    </div>`).join('') : `<div class="log-item"><div class="log-note">아직 기록이 없어요. 첫 기록을 남겨보세요.</div></div>`;

  document.getElementById('detail-body').innerHTML = html;

  if (r.isHabit) {
    document.getElementById('habit-btn').addEventListener('click', () => {
      const today = todayStr();
      const list = state[r.id];
      const idx = list.findIndex(x => x.date === today);
      if (idx >= 0) list.splice(idx, 1); else list.push({ date: today, amount: 1 });
      saveState(); renderDetail();
    });
  } else {
    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('amount-input');
      const amt = parseFloat(input.value);
      const btn = document.getElementById('add-btn');
      const hint = document.getElementById('log-hint');
      if (isNaN(amt) || amt <= 0) {
        hint.classList.add('show');
        btn.classList.add('shake');
        input.focus();
        setTimeout(() => btn.classList.remove('shake'), 300);
        return;
      }
      hint.classList.remove('show');
      const note = document.getElementById('note-input').value.trim();
      state[r.id].push({ date: todayStr(), amount: amt, note });
      saveState(); renderDetail();
    });
  }
  document.querySelectorAll('[data-del]').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.getAttribute('data-del'));
      state[r.id].splice(idx, 1);
      saveState(); renderDetail();
    });
  });
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

document.getElementById('back-btn').addEventListener('click', closeDetail);
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('모든 기록을 초기화할까요? 되돌릴 수 없어요.')) {
    localStorage.removeItem(STORAGE_KEY);
    loadState(); renderHome();
  }
});

loadState();
renderHome();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
